[[mods]]
modId="tcmateditor"
version="${version}"
displayName="Tinkers' Construct Tool"
authors="nizabushangtianm"
displayTest="IGNORE_SERVER_VERSION"
description='''
In-game material editor for official Tinkers' Construct on NeoForge 1.20.1 (Shift+Z).
Exported materials use standard Tinkers' Construct data/resource packs.
'''

[[dependencies.tcmateditor]]
modId="forge"
mandatory=true
versionRange="${forge_range}"
ordering="NONE"
side="BOTH"

[[dependencies.tcmateditor]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_range}"
ordering="NONE"
side="BOTH"

[[dependencies.tcmateditor]]
modId="mantle"
mandatory=true
versionRange="${mantle_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.tcmateditor]]
modId="tconstruct"
mandatory=true
versionRange="${tconstruct_range}"
ordering="AFTER"
side="BOTH"
