modLoader="javafml"
loaderVersion="${loader_range}"
license="MIT"

[[mods]]
modId="tcmateditor"
version="${version}"
displayName="Tinkers' Construct Tool"
authors="nizabushangtianm"
description='''
In-game material editor for Tinkers' Construct (Shift+Z).
Materials, entries and upgrades use Tinkers' Construct data/resource pack formats. New fluids export to a standalone mod JAR or a KubeJS startup script. Exported content keeps working without this editor.
'''

[[dependencies.tcmateditor]]
modId="neoforge"
type="required"
versionRange="${neo_range}"
ordering="NONE"
side="BOTH"

[[dependencies.tcmateditor]]
modId="minecraft"
type="required"
versionRange="${minecraft_range}"
ordering="NONE"
side="BOTH"

[[dependencies.tcmateditor]]
modId="tconstruct"
type="required"
versionRange="${tconstruct_range}"
ordering="AFTER"
side="BOTH"
