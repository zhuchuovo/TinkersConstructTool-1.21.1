plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'com.tcmateditor'
version = "${minecraft_version}-${mod_version}"

base { archivesName = 'TinkersConstructTool' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases' }
    maven { name = 'DVS1'; url = 'https://dvs1.progwml6.com/files/maven' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
}

// NeoForge 1.20.1 uses Forge's packages, FML metadata and SRG mappings.
minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run-neoforge-1.20.1')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods { tcmateditor { source sourceSets.main } }
        }
        client {
            if (project.hasProperty('quickPlay')) {
                args '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
            if (project.hasProperty('selfTest')) {
                property 'tcmateditor.selftest', 'true'
                property 'tcmateditor.selftest.quit', 'true'
            }
        }
        server {
            args '--nogui'
        }
        gameTestServer {
            workingDirectory project.file('run-neoforge-1.20.1/server-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'tcmateditor.gametest', 'true'
            if (project.hasProperty('exportGameTest')) {
                property 'tcmateditor.exportGameTest', 'true'
            }
        }
    }
}

dependencies {
    minecraft "net.neoforged:forge:${minecraft_version}-${neo_version}"
    implementation fg.deobf("slimeknights.mantle:Mantle:${minecraft_version}-${mantle_version}")
    implementation fg.deobf("slimeknights.tconstruct:TConstruct:${minecraft_version}-${tconstruct_version}")
    // Optional development recipe viewer, not bundled with the editor.
    if (project.hasProperty('withJei')) {
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    }
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junit_version}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit_platform_version}"
}

tasks.named('test', Test).configure { useJUnitPlatform() }

// A game can exit normally even when a self-test assertion fails.
tasks.matching { it.name == 'runClient' }.configureEach {
    if (project.hasProperty('selfTest')) {
        doFirst {
            delete file('run-neoforge-1.20.1/tcmateditor/selftest.txt')
        }
        doLast {
            def report = file('run-neoforge-1.20.1/tcmateditor/selftest.txt')
            if (!report.isFile() || !report.getText('UTF-8').trim().endsWith('ALL PASSED')) {
                throw new GradleException("Game self-test failed; see ${report} and the client log.")
            }
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        version: mod_version, loader_range: loader_range,
        minecraft_range: minecraft_range, forge_range: forge_range,
        tconstruct_range: tconstruct_range, mantle_range: mantle_range
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') { expand replaceProperties }
}

tasks.named('jar', Jar).configure {
    exclude 'com/tcmateditor/dev/**'
    manifest {
        attributes([
            'Specification-Title': "Tinkers' Construct Tool",
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
